<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon & Cross-Browser Tab Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#10b981" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#020617" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Save Our Spends: A fast, serverless expense sharing web app powered by Google Sheets and Google Drive." />
    <title>Save Our Spends</title>

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('spread_spends_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
          var themeColor = isDark ? '#020617' : '#10b981';
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var metaThemes = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metaThemes.length; i++) {
            metaThemes[i].setAttribute('content', themeColor);
          }
          var metaScheme = document.querySelector('meta[name="color-scheme"]');
          if (metaScheme) {
            metaScheme.setAttribute('content', isDark ? 'dark' : 'light');
          }
        } catch (e) {}

        function isIgnoredScript(src) {
          if (!src) return true;
          // Ignore third-party analytics, beacons, extensions, and non-critical tracking scripts
          var ignoredPatterns = [
            'cloudflareinsights.com',
            'cloudflare.com',
            'accounts.google.com',
            'google-analytics.com',
            'googletagmanager.com',
            'chrome-extension:',
            'moz-extension:',
            'safari-extension:',
            'edge-extension:'
          ];
          for (var i = 0; i < ignoredPatterns.length; i++) {
            if (src.indexOf(ignoredPatterns[i]) !== -1) {
              return true;
            }
          }
          return false;
        }

        function showEmergencyError(msg) {
          if (window.__SPREAD_SPENDS_MOUNTED) return;
          var errBox = document.getElementById('emergency-error-box');
          if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'emergency-error-box';
            errBox.style = 'position:fixed;inset:0;background:#090d16;color:#f87171;padding:24px;font-family:system-ui,sans-serif;z-index:999999;overflow-y:auto;display:flex;flex-direction:column;gap:16px;';
            document.body.appendChild(errBox);
          }
          errBox.innerHTML = '<div style="font-size:18px;font-weight:bold;color:#ef4444;">Application Error</div>' +
            '<div style="font-size:13px;color:#cbd5e1;background:#1e293b;padding:12px;border-radius:8px;white-space:pre-wrap;font-family:monospace;">' + msg + '</div>' +
            '<div style="display:flex;gap:12px;margin-top:8px;flex-wrap:wrap;">' +
            '<button onclick="clearAndReload()" style="padding:10px 16px;background:#10b981;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Clear Cache & Reload</button>' +
            '<button onclick="window.location.reload()" style="padding:10px 16px;background:#334155;color:#fff;border:none;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Retry</button>' +
            '<button onclick="dismissEmergencyError()" style="padding:10px 16px;background:transparent;border:1px solid #475569;color:#cbd5e1;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;">Dismiss</button>' +
            '</div>';
        }

        window.dismissEmergencyError = function() {
          var box = document.getElementById('emergency-error-box');
          if (box) box.remove();
        };

        window.addEventListener('error', function(event) {
          if (window.__SPREAD_SPENDS_MOUNTED) return;

          // If it's a resource load error on a DOM element (captured via capture phase)
          if (event.target && event.target !== window) {
            var tag = (event.target.tagName || '').toUpperCase();
            if (tag !== 'SCRIPT') {
              return;
            }
            var src = event.target.src || '';
            if (isIgnoredScript(src)) {
              console.warn('Ignored script loading failure for non-critical resource:', src);
              return;
            }
            showEmergencyError('Failed to load application script: ' + src);
            return;
          }

          var msg = event.message || (event.error && event.error.message ? event.error.message : 'Application startup error');
          if (msg && (msg.indexOf('ResizeObserver') !== -1 || msg.indexOf('Script error') !== -1)) {
            return;
          }
          showEmergencyError(msg);
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (window.__SPREAD_SPENDS_MOUNTED) return;
          var reason = event.reason ? (event.reason.stack || event.reason.message || String(event.reason)) : 'Unhandled rejection';
          if (typeof reason === 'string' && (reason.indexOf('dynamically imported module') !== -1 || reason.indexOf('Loading chunk') !== -1)) {
            showEmergencyError(reason);
          }
        });

        window.clearAndReload = function() {
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              regs.forEach(function(r) { r.unregister(); });
            });
          }
          try { sessionStorage.clear(); } catch(e) {}
          window.location.reload(true);
        };
      })();
    </script>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Save Our Spends" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Save Our Spends" />

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-100 selection:text-emerald-900 dark:bg-slate-950 dark:text-slate-100 dark:selection:bg-emerald-900/50 dark:selection:text-emerald-200">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-family:system-ui,sans-serif;color:#94a3b8;">
        <div style="width:36px;height:36px;border:3px solid #10b981;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div style="font-size:14px;font-weight:500;letter-spacing:0.01em;">Loading Save Our Spends...</div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
